<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal notes on code, college, and things I learn">
  <title>myApp Digital Notebook</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="k.js" defer></script>
</head>
<body ng-controller="MainCtrl" ng-class="{'dark': isDark}">
  <nav>
    <a href="#" ng-click="setView('home')" class="logo">// myApp</a>
    <div class="nav-links">
      <a href="#" ng-click="setView('home')">Home</a>
      <a href="#" ng-click="setView('about')">About</a>
      <button class="theme-toggle" ng-click="isDark = !isDark" aria-label="Toggle theme">
        {{isDark ? '☀️' : '🌙'}}
      </button>
    </div>
  </nav>
  <main>
    <!-- HOME VIEW -->
    <section ng-show="view == 'home'">
      <h1>notes</h1>
      <p class="subtitle">things i learn in 3rd sem. mostly broken code and working code.</p>
      <input type="text" ng-model="search" placeholder="search notes..." class="search-box">
      <article class="post" ng-repeat="p in posts | filter:search | orderBy:'-date'">
        <span class="date">{{p.date}}</span>
        <h2><a href="#" ng-click="openPost(p)">{{p.title}}</a></h2>
        <p>{{p.excerpt}}</p>
        <div class="tags">
          <span ng-repeat="tag in p.tags">#{{tag}}</span>
        </div>
      </article>
      <p ng-show="(posts | filter:search).length == 0">no notes found.</p>
    </section>
    <!-- POST VIEW -->
    <section ng-show="view == 'post'" class="post-full">
      <a href="#" ng-click="setView('home')" class="back-link">← back to all notes</a>
      <span class="date">{{activePost.date}}</span>
      <h1>{{activePost.title}}</h1>
      <div class="tags">
        <span ng-repeat="tag in activePost.tags">#{{tag}}</span>
      </div>
      <p style="white-space: pre-line;">{{activePost.body}}</p>
    </section>
    <!-- ABOUT + CONTACT VIEW -->
    <section ng-show="view == 'about'" ng-include="'about-contact.html'"></section>
  </main>
  <footer>
    <p>built with angularjs. hosted on github pages.</p>
  </footer>
</body>
</html>
